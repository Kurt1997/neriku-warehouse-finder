<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7BADE3"><title>Neriku Warehouse Finder</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7fc;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#39291f}header{background:#7BADE3;color:#4A3021;padding:20px 18px 24px}main{max-width:760px;margin:auto;padding:22px 15px}.brand{font-size:14px;letter-spacing:3px;font-weight:700}h1{font-size:27px;margin:9px 0 3px}header p{opacity:.85;margin:0}.search{width:100%;font-size:20px;padding:17px;border:2px solid #b3cdea;border-radius:13px;outline:none}.search:focus{border-color:#4A3021}.hint{font-size:13px;color:#62736b;margin:14px 0}.item{background:white;border:1px solid #cadced;border-radius:14px;margin:12px 0;padding:18px;display:flex;gap:14px;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #4A302110}.item h2{font-size:17px;margin:0 0 6px}.meta{font-size:13px;color:#675d55;line-height:1.7}.location{min-width:88px;background:#dceafb;padding:11px;border-radius:10px;text-align:center}.location small{display:block;font-size:10px;letter-spacing:1px;color:#4A3021}.location strong{font-size:24px}.warn{font-size:11px;color:#995d11;margin-top:5px}.empty{padding:28px;text-align:center;color:#685e57}footer{font-size:12px;text-align:center;color:#6d655f;padding:20px}#count{font-size:14px;font-weight:600}button{border:0;border-radius:9px;padding:9px 13px;background:#dceafb;color:#4A3021;cursor:pointer}details{margin-top:35px;border-top:1px solid #cadced;padding-top:12px;color:#685e57;font-size:13px}details summary{cursor:pointer}.logo{display:block;width:min(100%,390px);height:auto;margin:0 0 8px}header p{color:#4A3021} .search:focus{box-shadow:0 0 0 3px #7BADE355} .item{border-left:4px solid #7BADE3} .location{border:1px solid #aac8e8} @media(max-width:430px){header{padding:16px 14px}.logo{width:min(100%,320px)}h1{font-size:24px}.item{padding:14px}.location{min-width:80px}}.suggest{background:#fff7e8;border:1px solid #e9c997;border-radius:12px;padding:12px 15px;margin:10px 0}.suggest button{margin:5px 5px 0 0;background:#dceafb;font-weight:600}.image-link{display:inline-block;margin-top:8px;color:#4A3021;font-size:12px;text-decoration:underline;text-underline-offset:2px}.search-note{font-size:12px;color:#675d55;margin:4px 0 10px}</style></head><body><header><div style="max-width:760px;margin:auto"><img class="logo" src="neriku-logo.png" alt="NERIKU official logo"><h1>Warehouse Finder</h1><p>Find a product. Find its shelf.</p></div></header><main><input class="search" id="q" type="search" placeholder="Search e.g. chicken, lentils, RM123" autocomplete="off" autofocus><p class="hint" id="count">Loading products…</p><div id="suggestions" aria-live="polite"></div><section id="results" aria-live="polite"></section></main><footer>Neriku warehouse internal reference · Locations must be maintained by warehouse management</footer><script>
let products=[];const q=document.getElementById('q'),results=document.getElementById('results'),count=document.getElementById('count');
function parseCSV(text){let rows=[],row=[],v='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);let head=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim().toLowerCase());return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()]))).filter(x=>x['product description']);}
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function distance(a,b){if(a===b)return 0;let v=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,v[j]+1,v[j-1]+(a[i-1]===b[j-1]?0:1));v=next}return v[b.length]}
function words(p){return normalize([p['product description'],p['alternative search terms'],p['category'],p['item code']].join(' ')).split(' ').filter(Boolean)}
function score(p,query){let hay=normalize([p['product description'],p['alternative search terms'],p['category'],p['item code']].join(' '));let tokens=query.split(' ').filter(Boolean);if(!tokens.length)return 0;let vocab=words(p);let total=0;for(const t of tokens){if(hay.includes(t)){total+=100;continue}let best=Infinity;for(const w of vocab){if(w.length<2)continue;let d=distance(t,w);if(w.startsWith(t)||t.startsWith(w))d=Math.min(d,1);best=Math.min(best,d)}let allowed=t.length<=3?1:t.length<=6?2:3;if(best>allowed)return -1;total+=40-best*10}return total}
function render(){let query=normalize(q.value),suggest=document.getElementById('suggestions');suggest.replaceChildren();let ranked=products.map(p=>({p,score:score(p,query)})).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score);let exact=ranked.filter(x=>x.score>=100*query.split(' ').filter(Boolean).length);let fuzzy=ranked.filter(x=>!exact.includes(x));let shown=query?(exact.length?exact.concat(fuzzy.slice(0,Math.max(0,8-exact.length))):fuzzy.slice(0,8)):ranked;
count.textContent=shown.length+' matching product'+(shown.length===1?'':'s')+(query&&fuzzy.length&&!exact.length?' · closest suggestions':'');results.replaceChildren();if(query&&fuzzy.length){let panel=el('div','suggest');panel.append(el('strong','',exact.length?'Similar products':'Did you mean one of these?'));let names=[...new Set(fuzzy.slice(0,4).map(x=>x.p['product description']))];for(const name of names){let btn=el('button','',name);btn.type='button';btn.addEventListener('click',()=>{q.value=name;render();q.focus()});panel.append(btn)}suggest.append(panel)}if(!shown.length){results.append(el('div','empty',products.length?'No matching products. Try a shorter word or item code.':'No products loaded. Check products.csv.'));return}for(const {p} of shown.slice(0,100)){let card=el('article','item'),left=el('div'),right=el('div','location');left.append(el('h2','',p['product description']));left.append(el('div','meta',[p['item code'],p['category'],p['shelf level']&&'Level: '+p['shelf level']].filter(Boolean).join(' · ')));if((p['status']||'').toUpperCase().includes('DEMO'))left.append(el('div','warn','Demo location — verify before use'));let link=el('a','image-link','Find product image ↗');link.href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(p['product description']);link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label','Search online images for '+p['product description']);left.append(link);right.append(el('small','','SHELF'));right.append(el('strong','',p['shelf location']||'—'));card.append(left,right);results.append(card)}if(shown.length>100)results.append(el('div','hint','Showing first 100 results. Refine your search.'))}
q.addEventListener('input',render);fetch('products.csv',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Missing products.csv');return r.text()}).then(t=>{products=parseCSV(t);render()}).catch(()=>{count.textContent='Could not load products.csv. Open the site through a web server (not as a local file).';render()});
</script></body></html>
